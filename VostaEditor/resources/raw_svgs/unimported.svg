  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#hazard)"/>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="10"
     font-weight="bold" text-anchor="middle">
    <text x="32" y="24.5">NOT</text>
